name: Build desktop installers
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/installers.yml
      - electron-builder.yml
      - electron.vite.config.ts
      - package.json
      - pnpm-lock.yaml
      - src/**
      - resources/**
      - scripts/**
      - native/**
permissions:
  contents: read
jobs:
  installers:
    name: ${{ matrix.platform }}-${{ matrix.arch }} (unsigned test build)
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            arguments: --win nsis --x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            arguments: --linux AppImage --x64
          - os: macos-15
            platform: macos
            arch: arm64
            arguments: --mac dmg --arm64 --config.mac.identity=- --config.mac.notarize=false
          - os: macos-15-intel
            platform: macos
            arch: x64
            arguments: --mac dmg --x64 --config.mac.identity=- --config.mac.notarize=false
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Only ad-hoc identities are used; this workflow receives no signing secrets.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the native integration on this OS
        run: >-
          pnpm build:native &&
          pnpm exec node --test tests/native-search.test.cjs tests/global-search.test.cjs
          tests/package-inspection.test.cjs
      - name: Install Electron runtime and its license notices
        run: pnpm exec install-electron
      - run: pnpm version:check
      - run: pnpm audit
      - run: pnpm build
      - name: Package unsigned installer for native testing
        run: pnpm exec electron-builder ${{ matrix.arguments }} --publish never
      - name: Inspect packaged application
        run: pnpm package:verify
      - name: Verify the macOS workspace and capture both themes
        if: runner.os == 'macOS'
        run: >-
          node scripts/measure-packaged-performance.cjs --runs=1 --items=100
          --duration-ms=15000 --screenshots --output=desktop-smoke/workspace.ndjson
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS' && success()
        with:
          name: kusu-macos-${{ matrix.arch }}-workspace-smoke
          path: desktop-smoke/
          if-no-files-found: error
          retention-days: 14
      - name: Collect installers and SHA-256 checksums
        run: node scripts/collect-installers.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: kusu-${{ matrix.platform }}-${{ matrix.arch }}-unsigned-test
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
